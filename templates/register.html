{% extends "base.html" %}
{% block title %}Create Account - PocketSmart{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-heading"><h1>PocketSmart</h1><p>AI-Powered Budget Planning</p></div>
  <div class="auth-card"><h2>Create Your Account</h2>
  {% if error %}<div class="error">{{error}}</div>{% endif %}
  <form method="post" action="/register">
    <label>Username</label><input name="username" placeholder="Choose a username" required>
    <label>Email</label><input type="email" name="email" placeholder="Enter your email" required>
    <label>Password</label><input type="password" name="password" placeholder="Create a strong password" required>
    <label>Confirm Password</label><input type="password" name="confirm_password" placeholder="Confirm your password" required>
    <button class="btn primary full" type="submit">Create Account ⇥</button>
  </form><p class="auth-foot">Already have an account? <a href="/login">Sign In</a></p></div>
</div>
{% endblock %}
